# 微信公众号 MCP 服务 —— nginx 反向代理
#
# 部署到 /etc/nginx/sites-available/wechat 后：
#   sudo ln -s /etc/nginx/sites-available/wechat /etc/nginx/sites-enabled/wechat
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS 由 certbot 追加（会改写本文件，自动补上 ssl_certificate / listen 443）：
#   sudo certbot --nginx -d wechat.bingodify.cn --non-interactive --agree-tos --redirect

server {
    listen 80;
    listen [::]:80;
    server_name wechat.bingodify.cn;

    # 需覆盖 /upload 端点（express 侧限 10mb，微信图文正文限 4mb）
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # MCP Streamable HTTP 可能返回流式响应，必须关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长连接：MCP 会话可能持续较久
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
